[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = espidf
monitor_speed = 115200
# El puerto se indica en los comandos de carga y monitor.
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
# El monitor no debe mover DTR/RTS: con el circuito de auto-reset deja la placa en modo descarga.
monitor_rts = 0
monitor_dtr = 0
